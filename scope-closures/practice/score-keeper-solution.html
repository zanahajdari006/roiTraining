<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice · The score keeper (solution)</title>
  <style>
    /* ---------- Page look ---------- */
    body {
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      margin: 0;
      padding: 40px 16px;
      background: #f1f2f8;
      color: #1b1f3b;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
    }

    .box {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

</head>
<body>
  <div class="page">
    <h1>Solution: The score keeper</h1>
    <div class="hint">One possible solution. (Slide 11)</div>

    <div class="box">
      <div class="hint">CONSOLE — press F12 (or right-click, Inspect) and open the Console tab.</div>
      Expected: 10, 15, 7, 35, then the four stretch messages.
    </div>
  </div>

  <script>
    function createScoreKeeper() {
      let score = 0;                    // private: only the inner function can reach it

      return function (points) {
        score = score + points;
        return score;
      };
    }

    const arta = createScoreKeeper();
    const drin = createScoreKeeper();

    console.log(arta(10));              // 10
    console.log(arta(5));               // 15
    console.log(drin(7));               // 7: drin has his own score
    console.log(arta(20));              // 35

    // score is private.
    // Uncomment the next line to see: ReferenceError: score is not defined
    // console.log(score);


    // STRETCH
    function createPasswordChecker(password, maxTries) {
      let triesLeft = maxTries;         // private, and remembered between calls

      return function (guess) {
        if (triesLeft === 0) {
          return 'Locked. Too many wrong tries.';
        }

        if (guess === password) {
          return 'Welcome!';
        }

        triesLeft = triesLeft - 1;
        return 'Wrong password. Tries left: ' + triesLeft;
      };
    }

    const login = createPasswordChecker('roi2026', 2);

    console.log(login('hello'));        // Wrong password. Tries left: 1
    console.log(login('roi2026'));      // Welcome!
    console.log(login('12345'));        // Wrong password. Tries left: 0
    console.log(login('roi2026'));      // Locked. Too many wrong tries.
  </script>
</body>
