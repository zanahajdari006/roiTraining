<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo 04 · Grid basics</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f7f6f2;
    }

    .item {
      background: #2b5c9e;
      color: white;
      font-size: 24px;
      padding: 20px;
      border-radius: 8px;
    }

    .container {
      display: grid;                                /* step 1: looks the same! */
      grid-template-columns: 200px 200px 200px;     /* step 2: 3 columns       */
      /* grid-template-columns: 1fr 1fr 1fr;      /* step 3: flexible        */
      /* grid-template-columns: 1fr 2fr 1fr;      step 3b: middle x2      */ 
      /* grid-template-columns: 250px 1fr; */        /* step 3c: sidebar shape  */
      /* grid-template-columns: repeat(3, 1fr);    /* step 3d: shortcut       */
      /* grid-template-rows: 100px 200px; */         /* step 4: row heights     */
      /* gap: 24px;                                /* step 5: spacing         */
    }

    /* Making the gap visible: the container background shows through it. */
    .container {
      background: #f6d3b5;
    }
  </style>
</head>
<body>
  <h1>Grid basics</h1>

  <!-- .container = grid container. Each .item = grid item (direct child). -->
  <div class="container">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
    <div class="item">5</div>
    <div class="item">6</div>
    <div class="item">7</div>
    <div class="item">
      8
      <p>I am inside item 8, so I am NOT a grid item.</p>
    </div>
    <div class="item">9</div>
  </div>

</body>
</html>
