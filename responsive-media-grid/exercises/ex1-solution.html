<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 1 · Responsive media (solution)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f7f6f2;
      color: #14213d;
    }

    .hero {
      position: relative;
      height: 50vh;
      overflow: hidden;
      background: #14213d;
    }

    .hero h1 {
      position: absolute;
      left: 24px;
      bottom: 24px;
      margin: 0;
      color: white;
      font-size: 40px;
    }

    article {
      max-width: 700px;
      margin: 0 auto;
      padding: 16px;
      background: white;
    }

    /* ===== YOUR CSS GOES BELOW THIS LINE ===== */

    /* Task 1: images never wider than their container, never squashed */
    img {
      max-width: 100%;
      height: auto;
      display: block; /* removes the small gap under inline images */
    }

    /* Task 3: videos fill the article width and keep their shape */
    video {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Task 5: the hero clip fills the whole hero box */
    .hero video {
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- Task 5: autoplay only works together with muted.
       loop = start again, playsinline = don't go fullscreen on iPhone. -->
  <section class="hero">
    <video src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
           autoplay muted loop playsinline></video>
    <h1>Spring in the Botanical Garden</h1>
  </section>

  <article>
    <h2>A morning among the flowers</h2>

    <!-- Task 2: srcset lists the files and their real widths.
         sizes: on screens up to 700px the image is the full screen width;
         above that the article stops growing, so the image is at most 700px. -->
    <img src="https://placehold.co/800x533/png?text=800w+file"
         srcset="https://placehold.co/400x267/png?text=400w+file 400w,
                 https://placehold.co/800x533/png?text=800w+file 800w,
                 https://placehold.co/1200x800/png?text=1200w+file 1200w"
         sizes="(max-width: 700px) 100vw, 700px"
         width="1200" height="800"
         alt="Rows of tulips in a garden">

    <p>
      The garden opens at 8 a.m. If you come early you will have the tulip
      field almost to yourself.
    </p>

    <!-- Tasks 3 + 4: the width="900" attribute is gone (CSS controls the size),
         controls and poster added. -->
    <video controls
           poster="https://placehold.co/1280x720/png?text=Click+to+play"
           src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4">
      Your browser does not support video.
    </video>

    <p>
      Watch the short clip above to see the garden in bloom.
    </p>
  </article>

</body>
</html>
