<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exercise 1 · Responsive media (starter)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f7f6f2;
      color: #14213d;
    }

    .hero {
      position: relative;
      height: 50vh;
      overflow: hidden;
      background: #14213d;
    }

    .hero h1 {
      position: absolute;
      left: 24px;
      bottom: 24px;
      margin: 0;
      color: white;
      font-size: 40px;
    }

    article {
      max-width: 700px;
      margin: 0 auto;
      padding: 16px;
      background: white;
    }

    /* ===== YOUR CSS GOES BELOW THIS LINE ===== */

  </style>
</head>
<body>

  <!-- TASK 5: this should be a silent, looping background clip
       that starts by itself and fills the hero box. -->
  <section class="hero">
    <video src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video>
    <h1>Spring in the Botanical Garden</h1>
  </section>

  <article>
    <h2>A morning among the flowers</h2>

    <!-- TASKS 1 + 2: make this image responsive.
         Files available (the text on each image tells you which one loaded):
           https://placehold.co/400x267/png?text=400w+file
           https://placehold.co/800x533/png?text=800w+file
           https://placehold.co/1200x800/png?text=1200w+file
         The article is never wider than 700px. -->
    <img src="https://placehold.co/1200x800/png?text=1200w+file"
         alt="Rows of tulips in a garden">

    <p>
      The garden opens at 8 a.m. If you come early you will have the tulip
      field almost to yourself.
    </p>

    <!-- TASKS 3 + 4: make this video fit the article on every screen,
         give it controls and a poster image:
           https://placehold.co/1280x720/png?text=Click+to+play -->
    <video width="900"
           src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4">
    </video>

    <p>
      Watch the short clip above to see the garden in bloom.
    </p>
  </article>

</body>
</html>
