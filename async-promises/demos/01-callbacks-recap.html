<body>
  <h1>Demo 01: Callbacks, a quick recap</h1>
  <p>Slide 3. Open the console to see the output: F12, then Console.</p>

  <script>
    // From Session 16: functions are values.
    // repeat() receives a function (action) and decides WHEN to call it.
    function repeat(times, action) {
      for (let i = 0; i < times; i++) {
        action(i);
      }
    }

    // A function you hand over to be called later is a CALLBACK.
    repeat(3, (i) => {
      console.log('Run', i);
    });

    // Run 0
    // Run 1
    // Run 2

    // Today the callback will not run straight away.
    // It will run LATER, when some waiting is over.
  </script>
</body>
