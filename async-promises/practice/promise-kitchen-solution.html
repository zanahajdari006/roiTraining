<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice · The promise kitchen (solution)</title>
  <style>
    /* ---------- Page look ---------- */
    body {
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      margin: 0;
      padding: 40px 16px;
      background: #f1f2f8;
      color: #1b1f3b;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
    }

    .box {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .hint {
      color: #6b7080;
      font-size: 15px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
    }

    ol {
      margin: 0;
      padding-left: 24px;
    }

    pre {
      margin: 0;
      font-size: 16px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Solution: The promise kitchen</h1>
    <div class="hint">One possible solution. (Slide 13)</div>

    <div class="box">
      <div class="hint">CONSOLE — press F12 (or right-click, Inspect) and open the Console tab.</div>
      Expected: pizza is ready, salad is ready, All done!, then Kitchen closed (the stretch).
    </div>
  </div>

  <script>
    const menu = ['pizza', 'burger', 'salad'];

    // TASK 1
    function cook(item) {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          if (menu.includes(item)) {
            resolve(item + ' is ready');
          } else {
            reject(new Error(item + ' is not on the menu'));
          }
        }, 1000);
      });
    }

    // TASK 2
    cook('pizza')
      .then((message) => {
        console.log(message);                   // pizza is ready
        return cook('salad');                   // TASK 3: change 'salad' to 'sushi'
      })
      .then((message) => {
        console.log(message);                   // salad is ready
        console.log('All done!');
      })
      .catch((error) => {
        console.log('Kitchen problem:', error.message);
      })
      .finally(() => {
        console.log('Kitchen closed');          // STRETCH: runs either way
      });

    // TASK 3, with 'sushi':
    //   pizza is ready
    //   Kitchen problem: sushi is not on the menu
    //   Kitchen closed
    //
    // Why "All done!" does not print:
    // cook('sushi') rejects, so the chain skips the remaining .then
    // and jumps straight to .catch.
  </script>
</body>
</html>
