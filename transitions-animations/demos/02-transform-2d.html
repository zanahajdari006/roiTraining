<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo 02 · 2D transforms</title>
  <style>
    /* ---------- Page look ---------- */
    body {
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      margin: 0;
      padding: 40px 16px;
      background: #f1f2f8;
      color: #1b1f3b;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
    }

    .box {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .hint {
      color: #6b7080;
      font-size: 15px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
    }

    .row {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
      padding: 20px 0;
    }

    .row div {
      width: 110px;
      height: 110px;
      background: #1b1f3b;
      color: white;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* ---------- The lesson ---------- */

    /* transition = HOW to get there */
    .row div {
      transition: transform 0.5s;
    }

    /* transform = WHERE to go */
    .move:hover {
      transform: translateX(50px);   /* move right */
    }

    .turn:hover {
      transform: rotate(120deg);      /* turn */
    }

    .grow:hover {
      transform: scale(2);         /* try 2 or 0.5 */
    }

    .lean:hover {
      transform: skew(20deg);        /* lean */
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>2D transforms</h1>
    <div class="hint">Move, turn, grow, lean. The other boxes don't move out of the way.</div>

    <div class="box">
      <div class="hint">Hover over each box.</div>
      <div class="row">
        <div class="move">move</div>
        <div class="turn">turn</div>
        <div class="grow">grow</div>
        <div class="lean">lean</div>
      </div>
    </div>
  </div>
</body>
</html>
