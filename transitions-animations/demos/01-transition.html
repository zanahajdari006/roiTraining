<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo 01 · Transitions</title>
  <style>
    /* ---------- Page look ---------- */
    body {
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      margin: 0;
      padding: 40px 16px;
      background: #f1f2f8;
      color: #1b1f3b;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
    }

    .box {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .hint {
      color: #6b7080;
      font-size: 15px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
    }

    .btn {
      font-size: 18px;
      padding: 12px 28px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    input {
      display: block;
      width: 100%;
      max-width: 320px;
      box-sizing: border-box;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
    }

    /* ---------- The lesson ---------- */

    /* BEFORE + the promise: "my color changes slowly" */
    .btn {
      background-color: #1b1f3b;
      color: white;
      transition: background-color 0.5s; /* try 3s */
    }

    /* AFTER */
    .btn:hover {
      background-color: #ff6b6b;
    }

    input {
      border: 2px solid #ccc;
      transition: border-color 0.4s;
    }

    input:focus {
      border-color: #ff6b6b;
      outline: none;
    }
    
  </style>
</head>
<body>
  <div class="page">
    <h1>Transitions</h1>
    <div class="hint">A transition makes a change smooth instead of sudden.</div>

    <div class="box">
      <div class="hint">HOVER — move the mouse over the button and away again.</div>
      <button class="btn">Hover me</button>
    </div>

    <div class="box">
      <div class="hint">FOCUS — click into the box, then click outside.</div>
      <input type="text" placeholder="Click into me">
    </div>
  </div>
</body>
</html>
