<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo 03 · 3D transforms</title>
  <style>
    /* ---------- Page look ---------- */
    body {
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      margin: 0;
      padding: 40px 16px;
      background: #f1f2f8;
      color: #1b1f3b;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
    }

    .box {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .hint {
      color: #6b7080;
      font-size: 15px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
    }

    .row {
      display: flex;
      gap: 40px;
      flex-wrap: wrap;
    }

    .stage {
      padding: 20px;
      border: 2px dashed #ccc;
      border-radius: 10px;
    }

    .card {
      width: 180px;
      height: 240px;
      background: #ff6b6b;
      color: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
    }

    /* ---------- The lesson ---------- */

    /* where you stand in the room (only on the right stage) */
    .with-perspective {
      perspective: 200px;   /* try 200px and 2000px */
    }

    .card {
      transition: transform 1s;
    }

    /* hover the parent, the card inside turns like a door */
    .stage:hover .card {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>3D transforms</h1>
    <div class="hint">rotateY turns like a door. perspective on the parent makes it look 3D.</div>

    <div class="box">
      <div class="hint">Hover the left card, then the right card.</div>
      <div class="row">
        <div class="stage">
          <div class="card">No perspective</div>
        </div>
        <div class="stage with-perspective">
          <div class="card">perspective</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
