<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo 04 · Keyframe animations</title>
  <style>
    /* ---------- Page look ---------- */
    body {
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      margin: 0;
      padding: 40px 16px;
      background: #f1f2f8;
      color: #1b1f3b;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
    }

    .box {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .hint {
      color: #6b7080;
      font-size: 15px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
    }

    .row {
      display: flex;
      gap: 60px;
      align-items: center;
      flex-wrap: wrap;
      padding: 10px 0;
    }

    .heart {
      font-size: 60px;
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 6px solid #e2e4f0;
      border-top-color: #ff6b6b;
      border-radius: 50%;
    }

    .light {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: gray;
    }

    /* ---------- The lesson ---------- */

    /* 1. Heart: from / to, forever, back and forth */
    @keyframes pulse {
      from { transform: scale(1); }
      to   { transform: scale(1.2); }
    }

    .heart {
      animation: pulse 1s infinite alternate;
    }

    /* 2. Loader: one full circle, same speed, forever */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .loader {
      animation: spin 1s linear infinite;
    }

    /* 3. Traffic light: more steps with percentages */
    @keyframes traffic {
      0%   { background-color: red; }
      50%  { background-color: yellow; }
      100% { background-color: green; }
    }

    .light {
      animation: traffic 3s infinite;
    }

    /* 4. Title: fades in once when the page opens */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    h1 {
      animation: fadeIn 2s;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Keyframe animations</h1>
    <div class="hint">Animations play by themselves. Nobody has to hover. Refresh to see the title fade in.</div>

    <div class="box">
      <div class="row">
        <div class="heart">&#10084;&#65039;</div>
        <div class="loader"></div>
        <div class="light"></div>
      </div>
    </div>
  </div>
</body>
</html>
