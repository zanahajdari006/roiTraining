<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo 01 · Operators</title>
  <style>
    /* ---------- Page look ---------- */
    body {
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      margin: 0;
      padding: 40px 16px;
      background: #f1f2f8;
      color: #1b1f3b;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
    }

    .box {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .hint {
      color: #6b7080;
      font-size: 15px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Operators</h1>
    <div class="hint">Calculate, store, compare and combine values. (Slides 4, 5 and 6)</div>

    <div class="box">
      <div class="hint">CONSOLE — press F12 (or right-click, Inspect) and open the Console tab.</div>
      Everything in this demo prints there. Keep the code open in VS Code next to it.
    </div>
  </div>

  <script>
    // An EXPRESSION is any piece of code that produces a value.
    // 7 + 2 is an expression: it produces 9.


    // ---------- 1. ARITHMETIC: calculate ----------
    console.log('--- Arithmetic ---');
    console.log(7 + 2);    // 9
    console.log(7 - 2);    // 5
    console.log(7 * 2);    // 14
    console.log(7 / 2);    // 3.5   (JavaScript does not round for you)
    console.log(7 % 2);    // 1     remainder: 7 / 2 = 3, and 1 is left over
    console.log(12 % 4);   // 0     remainder 0 = 12 divides by 4 perfectly
    console.log(7 ** 2);   // 49    power: 7 * 7
    let i = 7 + 3;
    console.log(i);        // 9

    let lives = 3;
    lives++;               // increment: add 1
    console.log(lives);    // 4
    lives--;               // decrement: subtract 1
    console.log(lives);    // 3

    // Order: * / % happen before + -
    console.log(2 + 3 * 4);     // 14
    console.log((2 + 3) * 4);   // 20  round brackets go first


    // ---------- 2. ASSIGNMENT: store ----------
    console.log('--- Assignment ---');
    let score = 10;   
    score += 5; 
    // let scoreChanged = score + 5;
    // console.log(scoreChanged);     // =  stores the value on the right in the variable on the left
          
    console.log(score);    // 15
    score -= 3;            // same as: score = score - 3
    console.log(score);    // 12
    score *= 2;            // same as: score = score * 2
    console.log(score);    // 24
    score /= 4;            // same as: score = score / 4
    console.log(score);    // 6

    // // Watch out: + with a string glues text together (concatenation)
    console.log('5' + 3);  // '53'
    console.log('5' - 3);  // 2   (minus turns the string into a number)


    // ---------- 3. COMPARISON: ask a yes/no question ----------
    // The answer is always a boolean: true or false.
    console.log('--- Comparison ---');
    console.log(5 === 5);     // true   equal
    console.log(5 !== 3);     // true   not equal
    console.log(8 > 3);       // true
    console.log(8 < 3);       // false
    console.log(18 >= 18);    // true   "or equal" counts
    console.log(17 <= 16);    // false

    // // == (loose) converts the types first. === (strict) checks the type too.
    console.log(5 == '5');    // true   <- avoid ==
    console.log(5 === '5');   // false  <- always use ===


    // ---------- 4. LOGICAL: combine questions ----------
    console.log('--- Logical ---');
    let age = 21;
    let hasTicket = true;
    console.log(age >= 18 && hasTicket);   // true   AND: both must be true

    let isWeekend = false;
    let isHoliday = true;
    console.log(isWeekend || isHoliday);   // true   OR: at least one is true

     let isRaining = true;
     console.log(!isRaining);               // true   NOT: flips true and false

    // TRY: change hasTicket to false and reload. What does the AND line print now?
  </script>
</body>
</html>
