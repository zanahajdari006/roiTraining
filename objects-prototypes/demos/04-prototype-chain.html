<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session 17 · Demo 04: The prototype chain</title>
</head>
<body>
  <h1>Demo 04: The prototype chain</h1>
  <p>Slide 7. Open the console to see the output: F12, then Console.</p>

  <script>
    // PROTOTYPE = every object has a hidden link to another object: its prototype.
    // Ask an object for a property it doesn't have, and JavaScript follows the link
    // and looks there, then in THAT object's prototype, and so on.
    // That path is the PROTOTYPE CHAIN. It always ends at null.

    // 1. Object.create(proto) makes a new, empty object whose prototype is proto.
    const person = {
      introduce() {
        return 'Hi, this is ' + this.name;
      }
    };

    const arta = Object.create(person);   // arta's prototype is person
    arta.name = 'Arta';

    console.log(arta.introduce());        // Hi, this is Arta
    // arta has no introduce of her own, so JavaScript followed the link to person.
    // And this is still arta: this = the object before the dot, wherever the method lives.

    // 2. See the link.
    console.log(Object.getPrototypeOf(arta) === person);   // true
    console.log(arta);   // {name: 'Arta'}   Click the arrow, then open [[Prototype]]: introduce is in there.

    // 3. Own or inherited?
    console.log(arta.hasOwnProperty('name'));        // true:  name is arta's own
    console.log(arta.hasOwnProperty('introduce'));   // false: introduce is inherited from person
    // Wait: we never wrote hasOwnProperty. It comes from Object.prototype, the next link:
    // arta → person → Object.prototype → null

    // 4. The link is LIVE. Nothing is copied: JavaScript looks it up every time.
    person.wave = function () {
      return this.name + ' waves hello';
    };
    console.log(arta.wave());             // Arta waves hello: added to person AFTER arta was made

    // 5. Own properties win. The search stops at the first match,
    //    just like shadowing in the scope chain (Session 16).
    arta.introduce = function () {
      return 'Tung! Arta here.';
    };
    console.log(arta.introduce());        // Tung! Arta here.

    delete arta.introduce;                // remove arta's own version...
    console.log(arta.introduce());        // Hi, this is Arta   ...and person's is found again

    // 6. Built-in objects use the same chain. That's where push and map come from.
    const list = ['a', 'b'];
    console.log(typeof list);                                       // object: arrays ARE objects
    console.log(Object.getPrototypeOf(list) === Array.prototype);   // true
    console.log(list.hasOwnProperty('map'));                         // false
    console.log(Array.prototype.hasOwnProperty('map'));              // true
    // list → Array.prototype → Object.prototype → null

    console.log(Object.getPrototypeOf(Object.prototype));           // null: the end of every chain
  </script>
</body>
</html>
