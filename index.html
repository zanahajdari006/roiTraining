
<!DOCTYPE html>
<html>
<head>
    <title>Car Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>  
<body>

    <header>
        <h1>CAR SHOWCASE</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Cars</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Find Your Dream Car</h2>

        <p>
            Explore our collection of powerful and stylish cars.
        </p>

        <button>Explore Cars</button>
    </section>

    <section class="cars">

        <h2>Featured Cars</h2>

        <div class="car-container">


            <div class="car-card">

                <img 
                    src="https://commons.wikimedia.org/wiki/Special:Redirect/file/BMW%20M4%20G82.jpg"
                    alt="BMW M4"
                >

                <h3>BMW M4</h3>

                <p>2024 • 3.0L Twin Turbo</p>

                <p>€85,000</p>

                <button>View Details</button>

            </div>


            <div class="car-card">

                <img 
                    src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Audi%20RS5%2C%20IAA%202017%2C%20Frankfurt%20%281Y7A2879%29.jpg"
                    alt="Audi RS5"
                >

                <h3>Audi RS5</h3>

                <p>2024 • 2.9L V6 Twin Turbo</p>

                <p>€78,000</p>

                <button>View Details</button>

            </div>


            <div class="car-card">

                <img 
                    src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Mercedes-Benz%20C63%20AMG.jpg"
                    alt="Mercedes C63"
                >

                <h3>Mercedes C63</h3>

                <p>2024 • 2.0L Turbo Hybrid</p>

                <p>€92,000</p>

                <button>View Details</button>

            </div>


        </div>

    </section>


</body>
</html>
