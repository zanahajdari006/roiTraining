<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Session 15 · Demo 01: Your first function</title>
</head>
<body>
  <h1>Demo 01: Your first function</h1>
  <p>Slide 4. Open the console to see the output: F12, then Console.</p>

  <script>
    // 1. DEFINE the function: write the recipe once.
    //    Nothing runs yet.
    function greet() {
      console.log('Welcome to ROI Academy!');
    }

    // 2. CALL the function: press the button.
    //    The round brackets are what make it run.
    greet();
    greet();
    greet();

    // Chrome may group the three identical lines into one,
    // with a small 3 next to it.

    // Try it: type  greet  (no brackets) in the console.
    // Nothing runs: the console just shows you the function itself.
  </script>
</body>
</html>
