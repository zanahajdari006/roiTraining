    // console.log(orderCoffee('large', 1));   // Not enough money

    function getPrice(size){
      if(size === 'large'){
        return 2;
       }else if(size === 'medium'){
        return 1.5;
       }else{
        return 1;
       }
    }

    function getChange(paid, price){
      return paid - price;
    }

    function orderCoffee(size, paid){
      const price = getPrice(size);
      if(paid < price){
        return 'Not enough money';
      }else{
        return 'Enjoy! Your change: ' + getChange(paid, price) + '€';
      }
    }

    console.log(orderCoffee('large',5));
    console.log(orderCoffee('medium',2));
    console.log(orderCoffee('small',1));
  </script>
