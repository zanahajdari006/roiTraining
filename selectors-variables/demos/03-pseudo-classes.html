<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo 03 · Pseudo-classes</title>
  <style>
    /* ---------- Page look (not part of the lesson) ---------- */
    body {
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      margin: 0;
      padding: 40px 16px;
      background: #f1f2f8;
      color: #1b1f3b;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
    }

    .box {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .hint {
      color: #6b7080;
      font-size: 15px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
    }

    h2 {
      margin: 0 0 12px;
    }

    button {
      font-size: 16px;
      padding: 10px 20px;
      border: 2px solid #1b1f3b;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      margin-bottom: 16px;
    }

    input {
      display: block;
      width: 100%;
      max-width: 320px;
      box-sizing: border-box;
      padding: 10px;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 6px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-width: 320px;
    }

    li {
      padding: 8px 12px;
      border-radius: 6px;
    }

    /* ---------- The lesson ---------- */

    /* STATE: mouse is over it */
    button:hover {
      background: #e8634a;
      border-color: #e8634a;
      color: white;
    }

    /* STATE: you clicked into it */
    input:focus {
      outline: 3px solid #4ecdc4;
    }

    /* POSITION in the list */
    li:first-child {
      font-weight: bold;
    }

    li:last-child {
      color: gray;
    }

    li:nth-child(odd) {   /* try even, or 2 */
      background: #e2e4f0;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Pseudo-classes</h1>
    <div class="hint">One colon : — a state (what the user does) or a position (where it is).</div>

    <div class="box">
      <div class="hint">STATES — move the mouse over the button, then click into the box.</div>
      <button>Hover me</button>
      <input type="text" placeholder="Click into me">
    </div>

    <div class="box">
      <div class="hint">POSITIONS — first is bold, last is gray, odd ones are striped.</div>
      <h2>My hobbies</h2>
      <ul>
        <li>Coding</li>
        <li>Football</li>
        <li>Music</li>
        <li>Reading</li>
        <li>Sleeping</li>
      </ul>
    </div>
  </div>
</body>
</html>
