<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo 01 · Child & sibling selectors</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f7f6f2;
    }

    /* CHILD  >  only links directly inside nav */
    nav > a {
      color: white;
      background: #1b1f3b;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
    }

    /* NEXT SIBLING  +  only the first p right after an h2 */
    h2 + p {
      font-size: 20px;
      font-weight: bold;
    }

    /* ALL SIBLINGS AFTER  ~  every p after the h2
       try changing  +  above to  ~  and see what happens */
    h2 ~ p {
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
    <div>
      <a href="#">I am inside a div, so I am NOT a direct child</a>
    </div>
  </nav>

  <section>
    <h2>About Me</h2>
    <p>First paragraph — right after the h2.</p>
    <p>Second paragraph.</p>
    <p>Third paragraph.</p>
  </section>
</body>
</html>
