<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo 05 · CSS variables</title>
  <style>
    /* 1. DEFINE the variables (two dashes!) */
    :root {
      --main: #1b1f3b;
      --accent: #ff6b6b;
      --light: #f1f2f8;
      --radius: 8px;
    }

    /* 2. USE them with var() */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: var(--light);
      color: var(--main);
    }

    h1 {
      color: var(--accent);
    }

    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius);
    }

    a {
      color: var(--accent);
    }

    .card {
      background: white;
      border: 2px solid var(--main);
      border-radius: var(--radius);
      padding: 16px;
      margin-top: 16px;
    }

    /* TRY IT: change --accent to green and refresh.
       Everything coral changes at once! */
  </style>
</head>
<body>
  <h1>Hello, I'm Alex</h1>
  <button>Contact me</button>
  <p><a href="#">My projects</a></p>

  <div class="card">
    <p>This card uses --main for the border and --radius for the corners.</p>
  </div>
</body>
</html>
