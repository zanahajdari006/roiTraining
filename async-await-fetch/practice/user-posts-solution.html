<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice · Fetch a user's posts (solution)</title>
  <style>
    /* ---------- Page look ---------- */
    body {
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      margin: 0;
      padding: 40px 16px;
      background: #f1f2f8;
      color: #1b1f3b;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
    }

    .box {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .hint {
      color: #6b7080;
      font-size: 15px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 8px;
    }

    ol {
      margin: 0;
      padding-left: 24px;
    }

    pre {
      margin: 0;
      font-size: 16px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Solution: Fetch a user's posts</h1>
    <div class="hint">One possible solution. This page needs an internet connection. (Slide 11)</div>

    <div class="box">
      <div class="hint">CONSOLE — press F12 (or right-click, Inspect) and open the Console tab.</div>
      Expected: Posts by Leanne Graham (the stretch), User 1 has 10 posts, then ten titles.
    </div>
  </div>

  <script>
    const API_URL = 'https://jsonplaceholder.typicode.com';

    async function getPosts(userId) {
      try {
        // STRETCH: fetch the user first, one request after the other
        const userResponse = await fetch(API_URL + '/users/' + userId);

        if (!userResponse.ok) {
          throw new Error('HTTP error ' + userResponse.status);
        }

        const user = await userResponse.json();
        console.log('Posts by', user.name);                 // Posts by Leanne Graham

        // TASK 1: the part after ? is a query parameter. It filters the posts.
        const response = await fetch(API_URL + '/posts?userId=' + userId);

        // TASK 2
        if (!response.ok) {
          throw new Error('HTTP error ' + response.status);
        }

        // TASK 3: this time the data is an array of objects
        const posts = await response.json();

        // TASK 4
        console.log('User ' + userId + ' has ' + posts.length + ' posts');

        for (let i = 0; i < posts.length; i++) {
          console.log((i + 1) + '. ' + posts[i].title);
        }
      } catch (error) {
        // TASK 5
        console.log('Something went wrong:', error.message);
      }
    }

    getPosts(1);

    // After changing '/posts' to '/postz':
    //   Posts by Leanne Graham
    //   Something went wrong: HTTP error 404
    //
    // Why the titles do not print:
    // response.ok is false, so throw jumps straight to catch
    // and skips every line below it inside try.
    //
    // Seeing 100 posts instead of 10? Check the spelling of userId in the URL.
    // The API ignores a filter it does not recognise and returns everything.
  </script>
</body>
</html>
